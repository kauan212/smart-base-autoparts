<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar | AutoParts</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

<header class="cabecalho">
    <div class="container topo">
        <a href="index.html" class="logo">
            <span class="logo-destaque">AUTO</span>PARTS
        </a>

        <div class="acoes" id="acoesUsuario">
            <a href="login.html">Já tenho conta</a>
            <a href="carrinho.html" class="carrinho">
                Carrinho <span id="quantidadeCarrinho">0</span>
            </a>
        </div>
    </div>
</header>

<main class="secao container">

    <div class="area-login">

        <div class="login-apresentacao">
            <span class="subtitulo">FAÇA PARTE DA AUTOPARTS</span>

            <h1>Crie sua conta.</h1>

            <p>
                Cadastre-se para comprar peças automotivas,
                acompanhar seus pedidos e ter acesso à sua
                área de cliente.
            </p>
        </div>

        <div class="formulario-login">

            <form id="formCadastro">

                <div class="campo-formulario">
                    <label for="nome">Nome completo</label>
                    <input
                        type="text"
                        id="nome"
                        placeholder="Digite seu nome completo"
                        required
                        minlength="3"
                    >
                </div>

                <div class="campo-formulario">
                    <label for="cpf">CPF</label>
                    <input
                        type="text"
                        id="cpf"
                        placeholder="000.000.000-00"
                        maxlength="14"
                        required
                    >
                </div>

                <div class="campo-formulario">
                    <label for="telefone">Telefone</label>
                    <input
                        type="tel"
                        id="telefone"
                        placeholder="(00) 00000-0000"
                        required
                    >
                </div>

                <div class="campo-formulario">
                    <label for="email">E-mail</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Digite seu e-mail"
                        required
                    >
                </div>

                <div class="campo-formulario">
                    <label for="senha">Senha</label>
                    <input
                        type="password"
                        id="senha"
                        placeholder="Crie uma senha"
                        required
                        minlength="6"
                    >
                </div>

                <div class="campo-formulario">
                    <label for="confirmarSenha">Confirmar senha</label>
                    <input
                        type="password"
                        id="confirmarSenha"
                        placeholder="Digite novamente sua senha"
                        required
                        minlength="6"
                    >
                </div>

                <button type="submit" class="botao-login">
                    Criar conta
                </button>

            </form>

            <div class="link-cadastro">
                <p>Já possui uma conta?</p>
                <a href="login.html">Entrar na minha conta</a>
            </div>

            <p id="mensagemCadastro" class="mensagem-formulario"></p>

        </div>

    </div>

</main>

<footer class="rodape">
    <div class="rodape-final">
        © 2026 AutoParts - Todos os direitos reservados.
    </div>
</footer>

<script src="js/script.js"></script>
<script src="js/cadastro.js"></script>

</body>
</html>
