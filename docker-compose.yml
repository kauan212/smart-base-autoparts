services:
  postgres:
    image: postgres:16
    container_name: smartbase_postgres
    restart: always
    environment:
      POSTGRES_USER: smartbase
      POSTGRES_PASSWORD: smartbase123
      POSTGRES_DB: smartbase
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: